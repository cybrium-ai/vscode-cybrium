# Publish Cybrium Security Scanner to the VS Code Marketplace.
#
# Trigger: push a tag matching v*  →  e.g. `git tag v0.2.0 && git push --tags`
#
# The tag NAME (minus the leading `v`) must match the `version` field in
# package.json — the workflow refuses to publish on mismatch. That way a
# `git tag v0.3.0` push without first bumping package.json fails fast
# instead of publishing the wrong version.
#
# Requires a GitHub Actions repo secret named VSCE_PAT — generate one at
# https://dev.azure.com/cybrium/_usersSettings/tokens with the scope:
#   Marketplace → Manage
# (per the team's existing note: the PAT comes from the `cybrium` Azure
# DevOps org, NOT cybrium-ai.)
#
# Publisher: cybrium-ai (registered on https://marketplace.visualstudio.com/manage/publishers/cybrium-ai)

name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the VSIX but don't publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Resolve version
        id: ver
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # On manual workflow_dispatch GITHUB_REF_NAME isn't a tag — skip the check.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG_VERSION, but package.json says $PKG_VERSION. Bump package.json or move the tag."
            exit 1
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $PKG_VERSION"

      # A re-pushed tag (or a tag push after a local `vsce publish`) would
      # otherwise fail the publish step on a duplicate-version rejection — or,
      # if VSCE_PAT is unset, on the empty-secret guard. Neither is a real
      # failure: the version is already live. Detect that and no-op cleanly.
      - name: Check if version already on Marketplace
        id: published
        run: |
          set +e
          LIVE=$(npx @vscode/vsce show cybrium-ai.cybrium 2>/dev/null \
                 | grep -E '^[[:space:]]*Version:' | head -1 | awk '{print $2}')
          set -e
          echo "Marketplace has: '${LIVE}'  ·  this tag wants: '${{ steps.ver.outputs.version }}'"
          if [ "$LIVE" = "${{ steps.ver.outputs.version }}" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Marketplace already has ${{ steps.ver.outputs.version }} — publish will be skipped (no-op)."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npx tsc -p ./

      - name: Build VSIX (always — helps debugging dry-run mode)
        run: npx @vscode/vsce package --no-yarn --out cybrium-security-scanner-${{ steps.ver.outputs.version }}.vsix

      - name: Upload VSIX as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cybrium-security-scanner-${{ steps.ver.outputs.version }}
          path: cybrium-security-scanner-${{ steps.ver.outputs.version }}.vsix
          retention-days: 90

      - name: Publish to Marketplace
        if: |
          steps.published.outputs.already != 'true' &&
          (github.event_name == 'push' || github.event.inputs.dry_run == 'false')
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is empty. Add it at: Settings → Secrets → Actions"
            exit 1
          fi
          npx @vscode/vsce publish --no-yarn --packagePath cybrium-security-scanner-${{ steps.ver.outputs.version }}.vsix --pat "$VSCE_PAT"

      - name: Summary
        run: |
          if [ "${{ steps.published.outputs.already }}" = "true" ]; then
            echo "## VS Code extension — publish skipped (already live)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Marketplace already has \`${{ steps.ver.outputs.version }}\` (likely published locally via \`vsce publish\`). No-op." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## VS Code extension published" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Version: \`${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Publisher: cybrium-ai" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Marketplace: https://marketplace.visualstudio.com/items?itemName=cybrium-ai.cybrium" >> "$GITHUB_STEP_SUMMARY"
          echo "- VSIX uploaded as build artifact for re-download" >> "$GITHUB_STEP_SUMMARY"
